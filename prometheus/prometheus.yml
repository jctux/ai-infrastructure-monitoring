global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  # Example: Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Add your scrape targets below
  # Example configurations (uncomment and modify as needed):
  
  # - job_name: 'node_exporter'
  #   static_configs:
  #     - targets: ['your-host:9100']
  
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['your-host:8080']
  
  # - job_name: 'litellm'
  #   static_configs:
