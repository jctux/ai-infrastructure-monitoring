version: '3.8'

services:
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - monitoring-network
    restart: unless-stopped
    labels:
      - "app=prometheus"
      - "environment=production"
      - "service=monitoring"

  # Alertmanager for handling alerts
  alertmanager:
    image: prom/alertmanager:latest
    container_name: monitoring-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alerting/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring-network
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      - "app=alertmanager"
      - "environment=production"
      - "service=monitoring"

  # AI Alert Processor (Custom Service)
  ai-alert-processor:
    build:
      context: ./ai_alert_processor
      dockerfile: Dockerfile
    container_name: ai-alert-processor
    ports:
      - "5050:5050"
    environment:
      - LITELLM_URL=${LITELLM_URL}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
      - PORT=5050
    networks:
      - monitoring-network
    restart: unless-stopped
    depends_on:
      - alertmanager
    labels:
      - "app=ai-alert-processor"
      - "environment=production"
      - "service=monitoring"

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana_custom/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana_custom/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring-network
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      - "app=grafana"
      - "environment=production"
      - "service=monitoring"

networks:
  monitoring-network:
    driver: bridge
    name: ai-infrastructure-monitoring

volumes:
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local
